name: Backfill full-text history

# One-off (re-runnable) job that pulls the 2017-to-date full-text counts from
# the GDELT DOC API and commits data/history_fulltext.csv and
# data/fulltext_plan.json.  It is resumable: categories already in the CSV
# are skipped, so a run cut short by rate limiting can simply be re-run.

on:
  workflow_dispatch:
  push:
    branches: [claude/tension-index-gpr-zp1hcb]
    paths: [".github/workflows/backfill-fulltext.yml", ".github/backfill-trigger"]

permissions:
  contents: write

concurrency:
  group: backfill-fulltext
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull full-text history
        # Stop after ~5h so the commit step always runs; re-run to resume.
        run: timeout 18000 python scripts/build_history.py --patient --end "$(date -u -d yesterday +%Y%m%d)" || true

      - name: Commit and push
        run: |
          git config user.name "tension-index bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history_fulltext.csv data/fulltext_plan.json || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data: full-text history from the GDELT DOC API"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 10))
          done
