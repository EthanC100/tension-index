name: Backfill full-text history

# One-off (re-runnable) job that pulls the 2017-to-date full-text counts from
# the GDELT DOC API and commits data/history_fulltext.csv and
# data/fulltext_plan.json.  It is resumable: categories already in the CSV
# are skipped, so a run cut short by rate limiting can simply be re-run.

on:
  workflow_dispatch:
  push:
    branches: [claude/tension-index-gpr-zp1hcb]
    paths: [".github/workflows/backfill-fulltext.yml", ".github/backfill-trigger"]

permissions:
  contents: write

concurrency:
  group: backfill-fulltext
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull full-text history (commits progress every 15 minutes)
        run: |
          git config user.name "tension-index bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p logs
          commit_progress() {
            git add data/history_fulltext.csv || true
            git add -f logs/backfill-fulltext.log || true
            [ -f data/fulltext_plan.json ] && git add data/fulltext_plan.json
            git diff --cached --quiet && return 0
            git commit -q -m "data: full-text history progress ($1)"
            for i in 1 2 3; do
              git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && return 0
              sleep $((i * 10))
            done
          }
          # Stop after ~5h so the final commit always runs; re-run to resume.
          timeout 18000 python scripts/build_history.py --patient \
              --end "$(date -u -d yesterday +%Y%m%d)" > logs/backfill-fulltext.log 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            for _ in $(seq 90); do kill -0 "$pid" 2>/dev/null || break; sleep 10; done
            commit_progress "running"
          done
          wait "$pid" || echo "build_history exited with $?"
          tail -n 40 logs/backfill-fulltext.log
          commit_progress "finished"

      - name: Rebuild the index with the full-text component and re-validate
        # Only once every category is in (build_history logs this line).
        run: |
          if ! grep -q "all categories done" logs/backfill-fulltext.log; then
            echo "full-text history incomplete; re-run this workflow to resume"
            exit 0
          fi
          python scripts/rebuild_daily.py
          python scripts/validate.py
          git add data/tension_daily.csv data/normalisation.json data/raw_slots_daily.csv validation
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild tension index with full-text component; refresh validation"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 10))
          done
