name: Daily tension index

on:
  schedule:
    # 06:40 UTC every day: yesterday's GDELT files are complete and the
    # DOC API has indexed them.  (Minute chosen off the hour to avoid the
    # GitHub cron rush.)
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to (re)compute, YYYY-MM-DD (default: yesterday UTC)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-tension-index
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Compute the day's score
        env:
          TARGET_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python scripts/daily.py --date "$TARGET_DATE"
          else
            python scripts/daily.py
          fi

      - name: Commit and push
        run: |
          git config user.name "tension-index bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tension_daily.csv
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data: tension index for $(tail -n 1 data/tension_daily.csv | cut -d, -f1)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
