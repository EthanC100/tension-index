name: Daily tension index

on:
  schedule:
    # 05:23 UTC every day.  GDELT's raw 15-minute files for the previous UTC
    # day are complete by ~01:00 UTC; the full-text API usually follows
    # within hours (later days revise it, see --fulltext-days).
    - cron: "23 5 * * *"
  push:  # TEMPORARY: one-off end-to-end test on the feature branch
    branches: [claude/tension-index-gpr-zp1hcb]
    paths: [".github/workflows/daily.yml"]
  workflow_dispatch:
    inputs:
      date:
        description: "Day to (re)compute, YYYY-MM-DD (default: yesterday UTC)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-tension-index
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Compute the day's score
        env:
          TARGET_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python scripts/daily.py --date "$TARGET_DATE"
          else
            python scripts/daily.py
          fi

      - name: Commit and push
        run: |
          git config user.name "tension-index bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tension_daily.csv data/history_fulltext.csv
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          day="${{ github.event.inputs.date }}"
          [ -n "$day" ] || day=$(date -u -d yesterday +%F)
          git commit -m "data: tension index for ${day}"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 10))
          done
